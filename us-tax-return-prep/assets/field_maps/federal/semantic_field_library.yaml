schema_version: "0.1"
description: "Semantic field-map targets for common federal forms. Use these suggestions after inspecting the current fillable PDF field names."
forms:
  f1040:
    title: "Form 1040"
    pdf: "f1040.pdf"
    targets:
      taxpayer_primary_name:
        label: "Primary taxpayer name"
        path: "taxpayer.primary.full_name"
        format: "text"
        required: true
      taxpayer_primary_ssn:
        label: "Primary taxpayer SSN"
        path: "taxpayer.primary.ssn"
        format: "digits"
        required: true
      taxpayer_spouse_name:
        label: "Spouse name"
        path: "taxpayer.spouse.full_name"
        format: "text"
      taxpayer_spouse_ssn:
        label: "Spouse SSN"
        path: "taxpayer.spouse.ssn"
        format: "digits"
      address:
        label: "Mailing address"
        template: "{taxpayer.address.line1} {taxpayer.address.line2}, {taxpayer.address.city}, {taxpayer.address.state} {taxpayer.address.zip}"
        format: "text"
        required: true
      filing_status_single:
        label: "Single filing status checkbox"
        path: "taxpayer.filing_status"
        type: "checkbox"
        required: true
      line_1a:
        label: "Total wages"
        path: "calculated.form_line_values.f1040.line_1a"
        format: "money_whole_dollars"
      line_2a:
        label: "Tax-exempt interest"
        path: "calculated.form_line_values.f1040.line_2a"
        format: "money_whole_dollars"
      line_2b:
        label: "Taxable interest"
        path: "calculated.form_line_values.f1040.line_2b"
        format: "money_whole_dollars"
      line_3a:
        label: "Qualified dividends"
        path: "calculated.form_line_values.f1040.line_3a"
        format: "money_whole_dollars"
      line_3b:
        label: "Ordinary dividends"
        path: "calculated.form_line_values.f1040.line_3b"
        format: "money_whole_dollars"
      line_7:
        label: "Capital gain or loss"
        path: "calculated.form_line_values.f1040.line_7"
        format: "money_whole_dollars"
      line_8:
        label: "Additional income from Schedule 1"
        path: "calculated.form_line_values.f1040.line_8"
        format: "money_whole_dollars"
      line_9:
        label: "Total income"
        path: "calculated.form_line_values.f1040.line_9_total_income"
        format: "money_whole_dollars"
      line_11:
        label: "Adjusted gross income"
        path: "calculated.form_line_values.f1040.line_11_adjusted_gross_income"
        format: "money_whole_dollars"
      line_12:
        label: "Standard or itemized deduction"
        path: "calculated.form_line_values.f1040.line_12_standard_or_itemized_deduction"
        format: "money_whole_dollars"
      line_14:
        label: "Total deductions"
        path: "calculated.form_line_values.f1040.line_14_total_deductions"
        format: "money_whole_dollars"
      line_15:
        label: "Taxable income"
        path: "calculated.form_line_values.f1040.line_15_taxable_income"
        format: "money_whole_dollars"
      line_16:
        label: "Tax"
        path: "calculated.form_line_values.f1040.line_16_tax"
        format: "money_whole_dollars"
      line_24:
        label: "Total tax"
