schema_version: "0.1"
description: "Machine-readable coverage catalog for California resident individual tax forms."
jurisdiction: "CA"
agency: "California Franchise Tax Board"
forms:
  ca540:
    title: "California Form 540"
    pdf_pattern: "{tax_year}-540.pdf"
    output_dir: "tax_forms/state/ca"
    blank_dir: "tax_forms/workpapers/blank_forms/ca"
    field_map_dir: "tax_forms/workpapers/field_maps/ca"
    inference: "confirmed_california_full_year_resident_return"
    calculation_coverage: "resident_form_540_with_ots"
    field_map_coverage: "user_generated_or_manual"
    official_form_url_pattern: "https://www.ftb.ca.gov/forms/{tax_year}/{tax_year}-540.pdf"
    notes:
      - "OpenTaxSolver is used for supported-year resident Form 540 math when reviewed inputs are available."
      - "AMT, Behavioral Health Services Tax inputs, use tax, special credits, penalties, payment instructions, and residency allocation still require review or explicit values."
  ca540ca:
    title: "Schedule CA (540)"
    pdf_pattern: "{tax_year}-540-ca.pdf"
    output_dir: "tax_forms/state/ca"
    blank_dir: "tax_forms/workpapers/blank_forms/ca"
    field_map_dir: "tax_forms/workpapers/field_maps/ca"
    inference: "california_federal_adjustment_review"
    calculation_coverage: "federal_amounts_and_explicit_adjustment_totals"
    field_map_coverage: "user_generated_or_manual"
    official_form_url_pattern: "https://www.ftb.ca.gov/forms/{tax_year}/{tax_year}-540-ca.pdf"
  ca540d:
    title: "Schedule D (540)"
    pdf_pattern: "{tax_year}-540-d.pdf"
    output_dir: "tax_forms/state/ca"
    blank_dir: "tax_forms/workpapers/blank_forms/ca"
    field_map_dir: "tax_forms/workpapers/field_maps/ca"
    inference: "california_capital_gain_loss_difference_review"
    calculation_coverage: "review_required"
    field_map_coverage: "user_generated_or_manual"
    official_form_url_pattern: "https://www.ftb.ca.gov/forms/{tax_year}/{tax_year}-540-d.pdf"
